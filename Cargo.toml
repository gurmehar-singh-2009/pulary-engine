[package]
name = "pulary-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
crop = "0.4.3"
gpui = "0.2.2"
gpui-component = "0.9.1"
gpui-kit = { version = "0.9.1", features = ["tree-sitter-languages"] }
rune = { git = "https://github.com/rune-rs/rune.git" }
rust-embed = "8.13.0"
autocorrect = "2.14.2"
chrono = "0.4"
color-lsp = "0.2.0"
tree-sitter-navi = "0.2.3"
gpui-component-story = { git = "https://github.com/longbridge/gpui-kit/crates/story" }

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
overflow-checks = false
incremental = false
panic = "abort"
strip = "debuginfo"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

nursery = { level = "deny", priority = -1 }

cargo = { level = "deny", priority = -1 }

missing_docs_in_private_items = "warn"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
multiple_crate_versions = "allow"

# [features]
# gpui-fast = ["gpui-kit/gpui-fast"]
